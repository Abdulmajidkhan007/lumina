name: APK Release

# Builds the Android APK and publishes it as a GitHub Release, so the landing
# page's "Get the app" button can link straight to a download:
#   https://github.com/Abdulmajidkhan007/lumina/releases/latest/download/lumina.apk
#
# Runs on every push to main that touches the app, or manually (Actions → APK
# Release → Run workflow). Signed with the Play upload key when the LUMINA_*
# secrets exist (see release.yml); otherwise with the committed debug keystore,
# which is fine for sideloading but NOT for the Play Store.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apk-release.yml'

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Upload key (if configured)
        env:
          KS: ${{ secrets.LUMINA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LUMINA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMINA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMINA_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "LUMINA_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.keystore"
              echo "LUMINA_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
              echo "LUMINA_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "LUMINA_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNED_WITH=upload key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=debug keystore (sideload only)" >> "$GITHUB_ENV"
          fi

      # Google Sign-In checks the APK's signing certificate. Firebase only knew
      # the debug key's SHA-1, so the upload-key-signed APK got DEVELOPER_ERROR.
      # Register whatever key signs this build (idempotent; duplicates are
      # rejected by the API and ignored here).
      - name: Imzo kalitini Firebase'ga ro'yxatlash
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT yo'q — SHA ro'yxatga qo'shilmadi; Google bilan kirish DEVELOPER_ERROR berishi mumkin."
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          FB="npx --yes firebase-tools@15"
          PROJECT=lumina-007app
          if [ -n "${LUMINA_UPLOAD_STORE_FILE:-}" ]; then
            CERT=$(keytool -list -v -keystore "$LUMINA_UPLOAD_STORE_FILE" -storepass "$LUMINA_UPLOAD_STORE_PASSWORD" -alias "$LUMINA_UPLOAD_KEY_ALIAS")
          else
            CERT=$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey)
          fi
          SHA1=$(awk '/SHA1:/ {print $2}' <<< "$CERT")
          SHA256=$(awk '/SHA256:/ {print $2}' <<< "$CERT")
          APP_ID=$(jq -r '.client[] | select(.client_info.android_client_info.package_name=="com.lumina") | .client_info.mobilesdk_app_id' android/app/google-services.json)
          KNOWN=$($FB apps:android:sha:list "$APP_ID" --project "$PROJECT" | tr -d ':' | tr 'A-F' 'a-f')
          for H in "$SHA1" "$SHA256"; do
            if grep -q "$(tr -d ':' <<< "$H" | tr 'A-F' 'a-f')" <<< "$KNOWN"; then
              echo "✓ ro'yxatda bor: ${H:0:8}…"
            else
              $FB apps:android:sha:create "$APP_ID" "$H" --project "$PROJECT" || echo "::warning::SHA qo'shilmadi: ${H:0:8}…"
            fi
          done

      - name: Build release APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lumina.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          SHA="${GITHUB_SHA::7}"
          gh release create "$TAG" "$RUNNER_TEMP/lumina.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lumina APK #${{ github.run_number }} ($SHA)" \
            --notes "Android APK, commit $SHA. Signed with: $SIGNED_WITH. Install: download lumina.apk on the phone and allow installs from this source." \
            --latest

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/sa.json"
