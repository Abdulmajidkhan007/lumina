name: Web Deploy

# Deploys web/ to Firebase Hosting AND publishes Firestore rules/indexes +
# Storage rules on push (web/rules/index changes) or manually.
# Requires repository secret FIREBASE_SERVICE_ACCOUNT — JSON key of a service
# account from Firebase Console -> Project settings -> Service accounts.
on:
  workflow_dispatch:
  push:
    branches: ['claude/instagram-inspired-rn-app-dddJu', 'main']
    paths:
      - 'web/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret missing — skipping deploy. Add it in Settings -> Secrets to enable."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.skip != 'true'
        with:
          node-version: 20

      - name: Build web
        if: env.skip != 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        if: env.skip != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: lumina-007app
          channelId: live

      # Publishes Firestore rules + composite indexes and Storage rules so the
      # user never has to touch the Firebase console for these.
      # Publishes Firestore rules + composite indexes automatically.
      # (Storage rules are deployed separately/manually — the default service
      # account lacks the Service Usage permission to enable the Storage API,
      # so including `storage` here 403s and blocks the Firestore deploy.)
      # Publishes Firestore rules + composite indexes and Storage rules.
      # Prefers a FIREBASE_TOKEN secret (from `firebase login:ci`) which carries
      # the owner's full permissions; falls back to the hosting service account.
      # NOTE: the hosting SA frequently lacks `firebaserules.admin`, which makes
      # the rules deploy 403 — if you see that warning, either add a
      # FIREBASE_TOKEN secret or grant the SA the "Firebase Rules Admin" +
      # "Cloud Datastore Index Admin" roles in GCP IAM.
      - name: Deploy Firestore + Storage rules + indexes
        if: env.skip != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying with FIREBASE_TOKEN…"
            npx --yes firebase-tools@13 deploy \
              --only firestore:rules,firestore:indexes,storage \
              --project lumina-007app --non-interactive --token "$FIREBASE_TOKEN" || \
              echo "::warning::Firestore/Storage deploy (token) failed — publish rules manually in the console."
          else
            printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            npx --yes firebase-tools@13 deploy \
              --only firestore:rules,firestore:indexes \
              --project lumina-007app --non-interactive || \
              echo "::warning::Firestore deploy failed (service account lacks firebaserules.admin) — add a FIREBASE_TOKEN secret or publish firestore.rules/indexes manually in the console."
            rm -f "$RUNNER_TEMP/sa.json"
          fi
