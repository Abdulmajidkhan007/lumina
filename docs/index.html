<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumina</title>
<style>
  :root {
    --accent: #C44FE8;
    --bg: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #55555a;
    --border: #e8e8ea;
    --surface: #faf7fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121014;
      --text: #f2f0f4;
      --text-secondary: #b8b4bd;
      --border: #2a2730;
      --surface: #1c1a20;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), #7b3fe4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }
  p.tag {
    color: var(--text-secondary);
    margin: 0 0 32px;
    font-size: 15px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link-btn {
    display: block;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: border-color 0.15s ease;
  }
  a.link-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  footer {
    margin-top: 32px;
    color: var(--text-secondary);
    font-size: 13px;
  }
  footer a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">L</div>
  <h1>Lumina</h1>
  <p class="tag">Legal &amp; support resources</p>
  <div class="links">
    <a class="link-btn" href="privacy-policy.html">Privacy Policy</a>
    <a class="link-btn" href="account-deletion.html">Delete Your Account</a>
  </div>
  <footer>
    <p>Questions? <a href="mailto:santexnika.atoyo@gmail.com">santexnika.atoyo@gmail.com</a></p>
  </footer>
</div>
</body>
</html>
